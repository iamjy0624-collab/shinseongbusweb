name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # data/ 에 엑셀이 있으면 새로 빌드하고, 없으면 이미 올려 둔 docs/data.js 를 그대로 사용합니다.
      - name: 입력 확인
        run: |
          if ls data/*.xlsx >/dev/null 2>&1; then
            echo "BUILD=1" >> "$GITHUB_ENV"
          elif [ -f docs/data.js ]; then
            echo "BUILD=0" >> "$GITHUB_ENV"
          else
            echo "::error::data/ 폴더에 엑셀(.xlsx)이 없고 docs/data.js 도 없습니다. 엑셀을 data/ 폴더에 올려 주세요."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: env.BUILD == '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치 (CPU 전용 PyTorch)
        if: env.BUILD == '1'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: 데이터 빌드 (전처리 → 학습 → docs/data.js)
        if: env.BUILD == '1'
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
